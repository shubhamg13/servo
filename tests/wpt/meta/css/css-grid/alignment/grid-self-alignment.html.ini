[grid-self-alignment.html]
# Servo does not support vertical writing modes (`layout.writing-mode.enabled`
# is off), so a grid item's writing mode is always reported as horizontal and
# `self-start`/`self-end` are resolved against the item's `direction` only.
# The cells below declare a vertical `writing-mode` on the item and expect
# geometry that depends on that unsupported writing mode; they therefore stay
# expected-FAIL even though the otherwise-identical horizontal cells
# (e.g. `.child 3`, `.child 4`) now pass.
